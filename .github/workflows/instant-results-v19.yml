name: Instant aggregate results v19 integration

on:
  push:
    branches:
      - feat/instant-aggregate-results-v19
    paths:
      - .github/workflows/instant-results-v19.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate instant-result workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement target: {label}')
              return text.replace(old, new, 1)

          def replace_function(text, name, next_name, new_code):
              pattern = rf'function {re.escape(name)}\([^\n]*\) \{{.*?(?=\nfunction {re.escape(next_name)}\()'
              updated, count = re.subn(pattern, new_code.rstrip() + '\n\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'could not replace function {name}')
              return updated

          app = read('app.js')
          app = replace_once(
              app,
              "import { setupReviewReorder } from './review-reorder-v18.js';",
              "import { setupReviewReorder } from './review-reorder-v18.js';\nimport { aggregateInstantRecognitions, attentionItems, attentionReason, isUnreadableName } from './instant-results-core.js';",
              'instant core import'
          )

          old_persist = '''function persistCurrentSession(forceStatus = '') {
            if (!state.recognitions.length) return;
            const allConfirmed = state.recognitions.every(item => item.status === 'confirmed');
            const workflowStatus = forceStatus || (allConfirmed ? 'complete' : 'review');
            const totals = allConfirmed ? aggregateRecognitions(state.recognitions, db.data.products) : [];
            db.saveSession(buildSessionSnapshot({
              id: state.sessionId,
              scanId: state.scanId || getActiveScanId(),
              writerTag: state.writerTag,
              source: state.source || 'manual',
              rawPayload: state.rawPayload,
              recognitions: state.recognitions,
              imageCount: state.files.length,
              workflowStatus,
              totals
            }));
            renderHistory();
          }'''.replace('          ', '')
          new_persist = '''function persistCurrentSession(forceStatus = '') {
            if (!state.recognitions.length) return;
            const workflowStatus = forceStatus || 'complete';
            const totals = aggregateInstantRecognitions(state.recognitions, db.data.products);
            db.saveSession(buildSessionSnapshot({
              id: state.sessionId,
              scanId: state.scanId || getActiveScanId(),
              writerTag: state.writerTag,
              source: state.source || 'manual',
              rawPayload: state.rawPayload,
              recognitions: state.recognitions,
              imageCount: state.files.length,
              workflowStatus,
              totals
            }));
            renderHistory();
          }'''.replace('          ', '')
          app = replace_once(app, old_persist, new_persist, 'persistCurrentSession')

          old_ingest = '''function ingestItems(items, source = 'manual') {
            const writerTag = currentWriterTag();
            state.sessionId = uid('session');
            state.scanId = getActiveScanId() || state.scanId;
            state.source = source;
            state.rawPayload = $('#analysisJson')?.value || '';
            state.expanded.clear();
            state.recognitions = items
              .map(item => resolveRecognitionItem(item, db.data, writerTag))
              .sort((a, b) => a.order - b.order);
            renderReview();
            void hydratePendingCatalogCandidates();
            renderHeaderStats();
            $('#resultArea').hidden = true;
            $('#reviewArea').hidden = false;
            $('#reviewArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }'''.replace('          ', '')
          new_ingest = '''function ingestItems(items, source = 'manual') {
            const writerTag = currentWriterTag();
            state.sessionId = uid('session');
            state.scanId = getActiveScanId() || state.scanId;
            state.source = source;
            state.rawPayload = $('#analysisJson')?.value || '';
            state.expanded.clear();
            state.recognitions = items
              .map(item => resolveRecognitionItem(item, db.data, writerTag))
              .sort((a, b) => a.order - b.order);
            renderReview();
            void hydratePendingCatalogCandidates();
            renderHeaderStats();
            renderTotals(false);
            $('#reviewArea').hidden = true;
            $('#resultArea').hidden = false;
            persistCurrentSession('complete');
            $('#resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }'''.replace('          ', '')
          app = replace_once(app, old_ingest, new_ingest, 'ingestItems')

          old_mark = '''function markDirty(item) {
            if (!item) return;
            if (item.status === 'confirmed') item.status = 'pending';
            $('#resultArea').hidden = true;
          }'''.replace('          ', '')
          new_mark = '''function markDirty(item) {
            if (!item) return;
            item.status = 'pending';
          }'''.replace('          ', '')
          app = replace_once(app, old_mark, new_mark, 'markDirty')

          old_candidate_tail = '''  const best = item.candidates[0];
            item.suggestedProductId = best?.productId || null;
            item.suggestedScore = best?.score || 0;
          }'''.replace('          ', '')
          new_candidate_tail = '''  const best = item.candidates[0];
            item.suggestedProductId = best?.productId || null;
            item.suggestedScore = best?.score || 0;
            if (best?.score >= 0.93) item.matchedProductId = best.productId;
          }'''.replace('          ', '')
          app = replace_once(app, old_candidate_tail, new_candidate_tail, 'refreshCandidates exact match')

          render_line = r'''function renderReviewLine(item) {
            const expanded = state.expanded.has(item.id);
            const product = productById(item.matchedProductId);
            const displayName = product?.canonicalName || item.rawName || '商品名を入力';
            const subLabel = linkedProductLabel(item);
            const secondary = subLabel || (item.manual ? '手動追加' : `AI ${formatConfidence(item.confidence)}`);
            const nameBlock = item.manual && !item.rawName
              ? `<button type="button" class="review-line-text name-touch" data-action="edit-name" data-id="${item.id}"><strong class="placeholder-name">商品名を入力</strong><div class="review-line-sub">タップして入力</div></button>`
              : `<div class="review-line-text"><strong>${escapeHtml(displayName)}</strong><div class="review-line-sub">${secondary}</div></div>`;
            const warning = attentionReason(item);
            const stateChip = item.cancelled
              ? '<span class="review-state cancelled">取消</span>'
              : warning
                ? '<span class="review-state instant-warn">要確認</span>'
                : '<span class="review-state instant-ok">読み取り済み</span>';

            return `<article class="review-line ${item.cancelled ? 'is-cancelled' : ''} ${item.manual ? 'is-manual' : ''}" data-id="${item.id}">
              <div class="review-line-main">
                <span class="paper-order">${item.order || ''}</span>
                ${nameBlock}
                <div class="quick-qty" aria-label="数量 ${item.quantity}">
                  <button type="button" data-action="qty-minus" data-id="${item.id}" aria-label="数量を1減らす" ${Number(item.quantity) <= 0 ? 'disabled' : ''}>−</button>
                  <strong>${item.quantity}</strong>
                  <button type="button" data-action="qty-plus" data-id="${item.id}" aria-label="数量を1増やす">＋</button>
                </div>
              </div>
              <div class="review-line-actions">
                ${stateChip}
                <button type="button" class="edit-toggle" data-action="toggle-edit" data-id="${item.id}">${expanded ? '閉じる' : '編集'}</button>
                <button type="button" class="line-tool-btn delete-line-btn" data-action="delete" data-id="${item.id}">削除</button>
              </div>
              ${expanded ? renderEditPanel(item) : ''}
            </article>`;
          }'''.replace('          ', '')
          app = replace_function(app, 'renderReviewLine', 'renderReview', render_line)

          render_review = r'''function renderReview() {
            const total = state.recognitions.length;
            const attention = attentionItems(state.recognitions).length;
            const cancelled = state.recognitions.filter(item => item.cancelled).length;
            $('#reviewBadge').textContent = `${total}件`;
            $('#reviewSummary').textContent = total
              ? `全${total}件${attention ? `　要確認 ${attention}件` : '　要確認なし'}${cancelled ? `　取消 ${cancelled}件` : ''}`
              : '解析結果がありません';
            if ($('#reviewProgressBar')) $('#reviewProgressBar').style.width = '100%';
            if ($('#reviewProgressText')) $('#reviewProgressText').textContent = attention ? `要確認 ${attention}件` : '読み取り済み';

            const list = $('#reviewList');
            if (!total) {
              list.innerHTML = '<div class="empty-state">解析結果を受け取ると、ここに表示されます。</div>';
              $('#finishReviewBtn').disabled = false;
              renderTotals(false);
              return;
            }

            list.innerHTML = groupRecognitions(state.recognitions).map(group => {
              const first = group.items[0];
              const last = group.items.at(-1);
              return `<section class="review-person-group">
                ${reviewGroupTitle(first)}
                ${group.items.map(renderReviewLine).join('')}
                <button type="button" class="group-add-item" data-action="insert-after" data-id="${last.id}">＋ 商品を追加</button>
              </section>`;
            }).join('');

            const finishButton = $('#finishReviewBtn');
            finishButton.disabled = false;
            finishButton.textContent = '編集を閉じて集計結果へ戻る';
            renderTotals(false);
            $('#resultArea').hidden = false;
            persistCurrentSession('complete');
          }'''.replace('          ', '')
          app = replace_function(app, 'renderReview', 'selectCandidate', render_review)

          app = replace_once(app,
              "  item.forceNew = false;\n  state.expanded.add(item.id);",
              "  item.forceNew = false;\n  item.confidence = 1;\n  item.note = '';\n  item.manualCorrected = true;\n  state.expanded.add(item.id);",
              'selectCandidate trusted correction')
          app = replace_once(app,
              "  item.forceNew = false;\n  state.expanded.add(item.id);\n  renderReview();\n  toast(`イオン綾川の「${candidate.name}」を選びました`);",
              "  item.forceNew = false;\n  item.confidence = 1;\n  item.note = '';\n  item.manualCorrected = true;\n  state.expanded.add(item.id);\n  renderReview();\n  toast(`イオン綾川の「${candidate.name}」を選びました`);",
              'selectCatalogCandidate trusted correction')

          insert_marker = 'function handleReviewClick(event) {'
          if insert_marker not in app:
              raise SystemExit('missing handleReviewClick marker')
          helpers = r'''function acceptRecognition(item) {
            if (!item) return;
            if (isUnreadableName(item.rawName)) {
              state.expanded.add(item.id);
              $('#reviewArea').hidden = false;
              renderReview();
              focusRecognitionName(item.id);
              toast('商品名を入力してください', 'warn');
              return;
            }
            item.confidence = 1;
            item.note = '';
            item.manualReviewed = true;
            renderReview();
            toast('この読み取りをそのまま採用しました');
          }

          function openRecognitionEditor(id) {
            const item = recognitionById(id);
            if (!item) return;
            state.expanded.add(item.id);
            $('#reviewArea').hidden = false;
            $('#reviewArea').classList.add('instant-detail-open');
            renderReview();
            requestAnimationFrame(() => {
              document.querySelector(`.review-line[data-id="${CSS.escape(item.id)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
          }

          function handleResultClick(event) {
            if (event.target.closest('#editDetailsBtn')) {
              $('#reviewArea').hidden = false;
              $('#reviewArea').classList.add('instant-detail-open');
              renderReview();
              $('#reviewArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
              return;
            }
            const open = event.target.closest('[data-open-recognition]');
            if (open) {
              openRecognitionEditor(open.dataset.openRecognition);
              return;
            }
            const accept = event.target.closest('[data-accept-recognition]');
            if (accept) {
              acceptRecognition(recognitionById(accept.dataset.acceptRecognition));
              return;
            }
            const remove = event.target.closest('[data-delete-recognition]');
            if (remove) deleteRecognition(recognitionById(remove.dataset.deleteRecognition));
          }

          '''.replace('          ', '')
          app = app.replace(insert_marker, helpers + insert_marker, 1)

          old_qty = '''  } else if (action === 'qty-minus' || action === 'qty-plus') {
            markDirty(item);
            item.quantity = Math.max(0, Number(item.quantity || 0) + (action === 'qty-plus' ? 1 : -1));
            renderReview();
          }'''.replace('          ', '')
          new_qty = '''  } else if (action === 'qty-minus' || action === 'qty-plus') {
            markDirty(item);
            item.quantity = Math.max(0, Number(item.quantity || 0) + (action === 'qty-plus' ? 1 : -1));
            if (/数量.*(判読|不明|困難)|(判読|不明|困難).*数量/u.test(String(item.note || ''))) item.note = '';
            item.confidence = Math.max(Number(item.confidence || 0), 0.95);
            item.manualCorrected = true;
            renderReview();
          }'''.replace('          ', '')
          app = replace_once(app, old_qty, new_qty, 'quantity edit clears warning')

          app = replace_once(app,
              "    item.rawName = value;\n    item.matchedProductId = null;",
              "    item.rawName = value;\n    item.confidence = 1;\n    item.note = '';\n    item.manualCorrected = true;\n    item.matchedProductId = null;",
              'name edit trusted correction')

          finish_review = '''function finishReview() {
            if (!state.recognitions.length) return;
            $('#reviewArea').hidden = true;
            $('#reviewArea').classList.remove('instant-detail-open');
            renderTotals();
            $('#resultArea').hidden = false;
            $('#resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
          }'''.replace('          ', '')
          app = replace_function(app, 'finishReview', 'locationOptions', finish_review)

          render_totals = r'''function renderTotals(save = true) {
            const totals = aggregateInstantRecognitions(state.recognitions, db.data.products);
            const attention = attentionItems(state.recognitions);
            $('#totalProductCount').textContent = totals.length;
            $('#totalQuantity').textContent = totals.reduce((sum, item) => sum + item.quantity, 0);
            if ($('#needsReviewCount')) $('#needsReviewCount').textContent = attention.length;

            const attentionPanel = $('#attentionPanel');
            const attentionList = $('#attentionList');
            if (attentionPanel && attentionList) {
              attentionPanel.hidden = attention.length === 0;
              attentionList.innerHTML = attention.map(item => {
                const reason = attentionReason(item);
                const readable = !isUnreadableName(item.rawName);
                return `<div class="attention-row">
                  <div class="attention-main">
                    <strong>${escapeHtml(item.rawName || '判読不明')} × ${Number(item.quantity || 1)}</strong>
                    <small>${escapeHtml(reason || '確認してください')}${item.person ? ` · ${escapeHtml(item.person)}` : ''}</small>
                  </div>
                  <div class="attention-actions">
                    <button type="button" class="attention-fix" data-open-recognition="${item.id}">修正</button>
                    ${readable ? `<button type="button" class="attention-accept" data-accept-recognition="${item.id}">このままでOK</button>` : ''}
                    <button type="button" class="attention-delete" data-delete-recognition="${item.id}">削除</button>
                  </div>
                </div>`;
              }).join('');
            }

            const grouped = new Map();
            for (const item of totals) {
              const key = item.location || '未設定';
              if (!grouped.has(key)) grouped.set(key, []);
              grouped.get(key).push(item);
            }
            const order = ['A', 'B', 'C', 'D', 'E', '未設定'];
            const extraLocations = [...grouped.keys()].filter(location => !order.includes(location)).sort((a, b) => a.localeCompare(b, 'ja'));
            const locations = [...order, ...extraLocations];
            $('#totalsList').innerHTML = locations
              .filter(location => grouped.has(location))
              .map(location => `<section class="location-group">
                <div class="location-title"><span>${escapeHtml(location)}</span><small>${grouped.get(location).length}商品</small></div>
                ${grouped.get(location).map(item => {
                  const firstId = item.sourceIds?.[0] || '';
                  const sourceCount = item.sourceIds?.length || 0;
                  const locationControl = item.productId
                    ? `<select class="location-select" data-product="${item.productId}" aria-label="売り場">${locationOptions(item.location)}</select>`
                    : '<span class="instant-unregistered">未登録</span>';
                  return `<div class="total-row instant-total-row">
                    <div class="total-name"><strong>${escapeHtml(item.canonicalName)}</strong>${item.attentionCount ? `<small>要確認 ${item.attentionCount}件を含む</small>` : ''}</div>
                    <div class="total-qty">${item.quantity}</div>
                    ${locationControl}
                    <button type="button" class="instant-edit-btn" data-open-recognition="${firstId}">${sourceCount > 1 ? '明細' : '修正'}</button>
                  </div>`;
                }).join('')}
              </section>`).join('') || '<div class="empty-state">集計できる商品はまだありません。要確認欄を修正してください。</div>';

            $$('.location-select').forEach(select => select.addEventListener('change', () => {
              db.setLocation(select.dataset.product, select.value);
              renderTotals();
              renderProducts();
              toast('売り場を更新しました');
            }));
            if (state.recognitions.length) $('#resultArea').hidden = false;
            if (save && state.recognitions.length) persistCurrentSession('complete');
          }'''.replace('          ', '')
          app = replace_function(app, 'renderTotals', 'shareSummary', render_totals)

          old_share_line = "  const totals = aggregateRecognitions(state.recognitions, db.data.products);"
          if old_share_line not in app:
              raise SystemExit('missing shareSummary aggregate line')
          app = app.replace(old_share_line, "  const totals = aggregateInstantRecognitions(state.recognitions, db.data.products);", 1)

          restore = r'''function restoreSessionById(id) {
            const session = db.getSession(id);
            if (!session?.recognitions?.length) return toast('復元できる履歴がありません', 'warn');
            state.sessionId = session.id;
            state.scanId = session.scanId || '';
            state.source = session.source || 'history';
            state.rawPayload = session.rawPayload || '';
            state.writerTag = session.writerTag || '';
            state.recognitions = cloneValue(session.recognitions);
            state.expanded.clear();
            if ($('#writerTag')) $('#writerTag').value = state.writerTag;
            if ($('#analysisJson')) $('#analysisJson').value = state.rawPayload;
            renderReview();
            void hydratePendingCatalogCandidates();
            renderTotals(false);
            $('#reviewArea').hidden = true;
            $('#resultArea').hidden = false;
            $('#resultArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
            toast('保存した集計結果を復元しました');
          }'''.replace('          ', '')
          app = replace_function(app, 'restoreSessionById', 'restoreLastActionResult', restore)

          app = replace_once(app,
              "    const status = session.workflowStatus === 'complete' ? '完了' : `確認途中 ${confirmed}/${total}`;",
              "    const status = session.workflowStatus === 'complete' ? '集計済み' : `保存済み ${total}件`;",
              'history status')

          app = replace_once(app,
              "  $('#reviewList').addEventListener('change', handleReviewChange);\n  $('#finishReviewBtn').addEventListener('click', finishReview);",
              "  $('#reviewList').addEventListener('change', handleReviewChange);\n  $('#resultArea').addEventListener('click', handleResultClick);\n  $('#finishReviewBtn').addEventListener('click', finishReview);",
              'result click events')

          write('app.js', app)

          html = read('index.html')
          html = replace_once(html,
              '  <link rel="stylesheet" href="./interaction-v18.css">',
              '  <link rel="stylesheet" href="./interaction-v18.css">\n  <link rel="stylesheet" href="./instant-results-v19.css">',
              'instant css link')

          review_section = '''      <section id="reviewArea" class="card" hidden>
        <div class="section-head">
          <div><span class="eyebrow">EDIT</span><h2>明細を修正</h2></div>
          <span id="reviewBadge" class="badge">0件</span>
        </div>
        <p id="reviewSummary" class="card-sub">必要な時だけ明細を直せます。</p>
        <div class="review-progress legacy-review-progress" aria-label="読み取り状態">
          <div class="review-progress-track"><div id="reviewProgressBar" class="review-progress-bar"></div></div>
          <strong id="reviewProgressText">読み取り済み</strong>
        </div>
        <div class="review-guide">商品名・数量・取消・順番を後から自由に直せます。変更は集計結果へ即時反映されます。</div>
        <div id="reviewList"></div>
        <button id="finishReviewBtn" class="primary-btn finish-review-btn">編集を閉じて集計結果へ戻る</button>
      </section>

'''
          pattern_review = r'      <section id="reviewArea" class="card" hidden>.*?(?=      <section id="resultArea")'
          html, count = re.subn(pattern_review, review_section, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('could not replace review section')

          result_section = '''      <section id="resultArea" class="card instant-result-card" hidden>
        <span class="eyebrow">RESULT</span>
        <h2>今回の集計結果</h2>
        <p class="instant-result-lead">画像から読み取れた商品を先にまとめています。問題がなければそのまま使えます。怪しいものだけ「要確認」に出します。</p>
        <div class="totals-summary instant-summary">
          <div class="summary-box"><strong id="totalProductCount">0</strong><span>商品種類</span></div>
          <div class="summary-box"><strong id="totalQuantity">0</strong><span>総数量</span></div>
          <div class="summary-box"><strong id="needsReviewCount">0</strong><span>要確認</span></div>
        </div>
        <section id="attentionPanel" class="attention-panel" hidden>
          <div class="attention-head"><strong>要確認・読み取りに自信がないもの</strong><span id="attentionCountBadge" class="attention-count">!</span></div>
          <div id="attentionList" class="attention-list"></div>
        </section>
        <div class="section-head"><div><h3>商品別集計・ピッキング表</h3></div></div>
        <div id="totalsList"></div>
        <div class="button-row instant-actions">
          <button id="editDetailsBtn" class="secondary-btn detail-edit-btn">明細を編集</button>
          <button id="shareSummaryBtn" class="secondary-btn">結果を共有</button>
          <button id="printBtn" class="primary-btn">印刷する</button>
        </div>
      </section>

'''
          pattern_result = r'      <section id="resultArea" class="card" hidden>.*?(?=      <section id="historyArea")'
          html, count = re.subn(pattern_result, result_section, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('could not replace result section')
          write('index.html', html)

          session = read('session-history-core.js')
          session = re.sub(r"^import \{ setupReviewReorder \} from './review-reorder-v17\.js';\n\nlet liveRecognitionItems = \[\];\n\nsetupReviewReorder\(\(\) => liveRecognitionItems\);\n\n", '', session, count=1)
          session = session.replace('  liveRecognitionItems = items;\n', '', 1)
          write('session-history-core.js', session)

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = '0.1.19'
          test_script = pkg['scripts']['test']
          if 'tests/instant-results-core.test.mjs' not in test_script:
              test_script = test_script.replace('tests/review-reorder-v18.test.mjs', 'tests/review-reorder-v18.test.mjs tests/instant-results-core.test.mjs')
          if 'node --check instant-results-core.js' not in test_script:
              test_script = test_script.replace('node --check review-reorder-v18.js', 'node --check review-reorder-v18.js && node --check instant-results-core.js')
          pkg['scripts']['test'] = test_script
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = read('sw.js')
          sw = sw.replace("const CACHE = 'order-sheet-pwa-v18';", "const CACHE = 'order-sheet-pwa-v19';", 1)
          if "'./instant-results-v19.css'" not in sw:
