name: Mobile review drag v18 integration

on:
  push:
    branches:
      - fix/mobile-review-drag-v18
    paths:
      - .github/workflows/mobile-review-drag-v18.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire drag runtime and interaction CSS
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('app.js'); s=p.read_text(); a=\"import { AeonCatalogDb } from './catalog-db.js';\\n\"; i=\"import { setupReviewReorder } from './review-reorder-v18.js';\\n\"; s=s if i in s else s.replace(a,a+i); c=\"  setupEvents();\\n  setupInstall();\"; s=s if 'setupReviewReorder(() => state.recognitions);' in s else s.replace(c,\"  setupEvents();\\n  setupReviewReorder(() => state.recognitions);\\n  setupInstall();\"); p.write_text(s)"
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(); a='  <link rel=\"stylesheet\" href=\"./capture-v14.css\">\\n'; i='  <link rel=\"stylesheet\" href=\"./interaction-v18.css\">\\n'; s=s if i in s else s.replace(a,a+i); p.write_text(s)"
      - name: Run tests
        run: npm test
      - name: Commit integrated changes
        shell: bash
        run: |
          git config user.name "order-sheet-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/mobile-review-drag-v18.yml
          git add app.js index.html
          git commit -m "Wire smooth mobile review dragging"
          git push origin HEAD:fix/mobile-review-drag-v18
