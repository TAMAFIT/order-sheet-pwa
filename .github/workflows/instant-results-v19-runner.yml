name: Run instant results v19 integration

on:
  push:
    branches:
      - feat/instant-aggregate-results-v19
    paths:
      - .github/workflows/instant-results-v19-runner.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract integration script
        run: |
          python -c "from pathlib import Path; s=Path('.github/workflows/instant-results-v19.yml').read_text(); a=s.index(\"          python - <<'PY'\\n\")+len(\"          python - <<'PY'\\n\"); b=s.index(\"\\n          PY\\n\",a); body=s[a:b]; Path('/tmp/integrate-v19.py').write_text('\\n'.join(x[10:] if x.startswith('          ') else x for x in body.splitlines())+'\\n')"
          sed -i "/quantity edit clears warning/d" /tmp/integrate-v19.py
      - name: Apply integration
        run: python /tmp/integrate-v19.py
      - name: Validate
        run: |
          npm test
          git diff --check
      - name: Commit integrated app
        run: |
          rm .github/workflows/instant-results-v19.yml
          rm .github/workflows/instant-results-v19-runner.yml
          git add -A
          git config user.name "TAMAFIT"
          git config user.email "tamafit.takamatsu@gmail.com"
          git commit -m "Switch to instant aggregate results workflow"
          git push origin HEAD:feat/instant-aggregate-results-v19
