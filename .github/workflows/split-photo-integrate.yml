name: Wire split photo capture

on:
  push:
    branches:
      - feat/split-photo-capture
    paths:
      - .github/workflows/split-photo-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire capture UI and bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          s = s.replace('  <link rel="stylesheet" href="./catalog-v13.css">', '  <link rel="stylesheet" href="./catalog-v13.css">\n  <link rel="stylesheet" href="./capture-v14.css">')
          s = s.replace('  <script type="module" src="./app.js"></script>\n  <script type="module" src="./chatgpt-flow.js"></script>', '  <script type="module" src="./app.js"></script>\n  <script type="module" src="./capture-ui.js"></script>\n  <script type="module" src="./chatgpt-flow.js"></script>')
          index.write_text(s, encoding='utf-8')

          css = Path('chatgpt-flow.css')
          s = css.read_text(encoding='utf-8').replace("v0.1.13", "v0.1.14")
          css.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace("const CACHE = 'order-sheet-pwa-v13';", "const CACHE = 'order-sheet-pwa-v14';")
          s = s.replace("  './catalog-v13.css',", "  './catalog-v13.css',\n  './capture-v14.css',")
          s = s.replace("  './image-orientation-core.js',", "  './image-orientation-core.js',\n  './capture-multishot-core.js',\n  './capture-ui.js',")
          sw.write_text(s, encoding='utf-8')

          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = '0.1.14'
          test_cmd = pkg['scripts']['test']
          if 'tests/capture-multishot.test.mjs' not in test_cmd:
              test_cmd = test_cmd.replace('node --test ', 'node --test tests/capture-multishot.test.mjs ', 1)
          if 'node --check capture-multishot-core.js' not in test_cmd:
              test_cmd += ' && node --check capture-multishot-core.js && node --check capture-ui.js'
          pkg['scripts']['test'] = test_cmd
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: npm test

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/split-photo-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add camera roll and split photo capture"
          git push origin HEAD:feat/split-photo-capture
